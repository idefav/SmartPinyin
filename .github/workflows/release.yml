name: Release macOS Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without leading v, e.g. 0.1.0)'
        required: true
        default: '0.1.0'
        type: string
      include_full_models:
        description: 'Also build full offline DMG & PKG with bundled GGUF models (~1.8 GB each)'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark GitHub Release as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish macOS arm64 Release
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
            INCLUDE_FULL="${{ inputs.include_full_models }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            INCLUDE_FULL="true"
            if echo "$VERSION" | grep -qE '-(alpha|beta|rc)'; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "include_full=${INCLUDE_FULL}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          printf 'Release version=%s tag=%s include_full=%s prerelease=%s\n' \
            "$VERSION" "$TAG" "$INCLUDE_FULL" "$PRERELEASE"

      - name: Install Homebrew dependencies
        run: |
          brew install xcodegen llama.cpp libomp
          brew list ggml >/dev/null 2>&1 || brew install ggml || true

      - name: Cache librime & Wanxiang RimeData
        uses: actions/cache@v4
        with:
          path: |
            Vendor/librime
            Resources/RimeData
          key: smartpinyin-deps-librime1.17.0-wanxiang18.2.1-lts

      - name: Fetch Rime & Wanxiang dependencies
        run: bash Scripts/fetch-deps.sh

      - name: Run unit tests gate
        run: swift test

      - name: Import optional macOS signing certificate
        id: sign
        env:
          MACOS_SIGN_P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -n "$MACOS_SIGN_P12_BASE64" ] && [ -n "$MACOS_SIGN_P12_PASSWORD" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/smartpinyin-signing.keychain-db"
            KEYCHAIN_PASS="$(uuidgen)"
            CERT_PATH="$RUNNER_TEMP/signing-cert.p12"

            printf '%s' "$MACOS_SIGN_P12_BASE64" | base64 --decode > "$CERT_PATH"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$MACOS_SIGN_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            rm -f "$CERT_PATH"

            IDENTITY="$MACOS_SIGN_IDENTITY"
            if [ -z "$IDENTITY" ]; then
              IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application:|Apple Development:/ {print $2; exit}')"
            fi
            echo "identity=${IDENTITY:--}" >> "$GITHUB_OUTPUT"
            echo "keychain=${KEYCHAIN_PATH}" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets configured; using ad-hoc signing (-)."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "keychain=" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Lite DMG & PKG (without bundled GGUF models)
        run: |
          bash Scripts/package-installer.sh \
            --format all \
            --no-bundle-models \
            --version "${{ steps.meta.outputs.version }}" \
            --sign-identity "${{ steps.sign.outputs.identity }}"
          rm -rf build/package-stage

      - name: Fetch GGUF models & package Full Offline DMG & PKG
        if: steps.meta.outputs.include_full == 'true'
        run: |
          df -h
          bash Scripts/fetch-deps.sh --with-models
          bash Scripts/package-installer.sh \
            --format all \
            --bundle-models \
            --version "${{ steps.meta.outputs.version }}" \
            --sign-identity "${{ steps.sign.outputs.identity }}"
          rm -rf build/package-stage Models

      - name: Verify artifacts & generate SHA256SUMS.txt
        run: |
          cd dist
          MAX_ASSET_BYTES=2147483648
          for f in SmartPinyin-${{ steps.meta.outputs.version }}-arm64*.dmg SmartPinyin-${{ steps.meta.outputs.version }}-arm64*.pkg; do
            [ -f "$f" ] || continue
            sz="$(stat -f '%z' "$f")"
            printf 'Artifact: %s (%s bytes)\n' "$f" "$sz"
            if [ "$sz" -ge "$MAX_ASSET_BYTES" ]; then
              printf 'ERROR: %s exceeds GitHub Release 2 GiB single-asset limit!\n' "$f" >&2
              exit 1
            fi
          done
          shasum -a 256 SmartPinyin-${{ steps.meta.outputs.version }}-arm64*.dmg SmartPinyin-${{ steps.meta.outputs.version }}-arm64*.pkg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ steps.meta.outputs.tag }}
          REL_VER: ${{ steps.meta.outputs.version }}
          REL_REPO: ${{ github.repository }}
          REL_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          python3 Scripts/render-release-notes.py \
            --tag "$REL_TAG" \
            --version "$REL_VER" \
            --repo "$REL_REPO" \
            --checksums "dist/SHA256SUMS.txt" \
            --output "$NOTES_FILE"

          PRERELEASE_ARGS=()
          if [ "$REL_PRERELEASE" = "true" ]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          shopt -s nullglob
          ASSETS=(dist/SmartPinyin-"${REL_VER}"-arm64*.dmg dist/SmartPinyin-"${REL_VER}"-arm64*.pkg dist/SHA256SUMS.txt)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "ERROR: No release assets found in dist/" >&2
            exit 1
          fi

          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release edit "$REL_TAG" --title "SmartPinyin ${REL_TAG}" --notes-file "$NOTES_FILE" "${PRERELEASE_ARGS[@]}"
            gh release upload "$REL_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$REL_TAG" "${ASSETS[@]}" --title "SmartPinyin ${REL_TAG}" --notes-file "$NOTES_FILE" "${PRERELEASE_ARGS[@]}"
          fi

      - name: Clean up temporary signing keychain
        if: always() && steps.sign.outputs.keychain != ''
        run: |
          security delete-keychain "${{ steps.sign.outputs.keychain }}" || true
